[build]
publish = "dist"
command = "npm run build"

  [build.environment]
  SECRETS_SCAN_OMIT_KEYS = "GFS_FIREBASE_CONFIG,GFS_FIREBASE_API_KEY,GFS_FIREBASE_APP_ID"
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyB6TYNujOLqIt1dzzhBkjsCvVgRt53luRE,AIzaSyCi57gPQcckjNuzDDIt6SLt48r-H-HD_-Y,1:187837905206:web:1e9a9bc33f745cbeeddb97"
  SECRETS_SCAN_OMIT_PATHS = "build.py,pages/**,README.md,GOOGLE_BUSINESS_PROFILE.md,firestore.rules,_gen_*.py,*.md"

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"

[[headers]]
for = "/*"

  [headers.values]
  X-Frame-Options = "SAMEORIGIN"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "geolocation=(self)"

[[headers]]
for = "/assets/css/*"

  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/assets/js/*"

  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/assets/img/*"

  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/admin/*"

  [headers.values]
  X-Robots-Tag = "noindex, nofollow"
  Cache-Control = "no-store"

